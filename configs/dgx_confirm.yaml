# DGX STEP 1 - CONFIRM the Kaggle decision at larger scale (A100 80 GB; we cap ourselves at 60 GB and wait for a free GPU).
# Kaggle decision: SentencePiece Unigram. Open question: 32K / 48K / 64K, and is it still ahead of our best BPE with a
# bigger proxy model and ~1.5 GB of text. Estimated time ~4-9 h (3 variants x 3 seeds; proxy speed on the A100 is NOT measured - see README).
name: dgx_confirm
paths: {raw: /data/malayalam/raw, clean: /data/malayalam/clean, runs: /data/malayalam/runs}
# plugins_dir: [/data/malayalam/my_plugins]

sources:
  - {type: hf_stream, id: fineweb2, hf: HuggingFaceFW/fineweb-2, name: mal_Mlym, split: train, text: text, max_docs: 1000000}   # ~6.7 GB; all 3.3M docs would take ~3.5 h to download and the trainers read <= ~4 GB. KEEP IDENTICAL in both DGX configs: they share raw/
  - {type: hf_stream, id: wikipedia, hf: wikimedia/wikipedia, name: 20231101.ml, split: train, text: text}
  - {type: hf_stream, id: sangraha, hf: ai4bharat/sangraha, data_dir: verified/mal, split: train, text: text}
filters:
  - {type: length, min_chars: 80, max_chars: 300000}
  - {type: ml_ratio, min_ratio: 0.5}
  - {type: line_repetition}
# 8 GB of training text, sources interleaved by weight (run 2 used 40/30/30); an exhausted source lets the others fill the cap.
split: {eval_permille: 3, shard_mb: 64, max_train_mb: 8000, balance: true, weights: {fineweb2: 0.4, sangraha: 0.3, wikipedia: 0.3}}

components: {normalizer: ml, pretokenizer: word, algorithm: spm_unigram, vocab: 48000}
resources: {workers: 32, threads: 32, max_word_types: 4000000, spm_max_mb: 3000}
search:
  eval_docs: 100000
  combine: false
  factors:
    algorithm: [spm_unigram, mlbpe]      # best BPE from run 2 as the challenger (mlbpe uses the base pretokenizer 'word')
metrics: [basic, structure, roundtrip, stress]
selector: {type: default}
store: none            # e.g. {type: hf_hub, repo: Akzhai/mltok-malayalam-runs, private: true, prefix: dgx}  (token: env HF_TOKEN) - or export HF_REPO for run_dgx.sh
sync: {enabled: true, min_interval_s: 120, ckpt_push_interval_s: 900, restore: true, include_cache: true, include_checkpoints: true, include_data: false}

proxy:
  enabled: true
  top_k: 2
  always_include: [spm_unigram, mlbpe]
  model: {type: gpt, size: small}                   # ~85M non-embedding params
  seq_len: 1024
  batch: 32                   # 64K-vocab float logits are large; stay inside the 60 GB cap
  micro_batch: 16
  gpus: [0]                   # NEVER 'auto' on the DGX: it would fan out over every GPU in the box
  train_mb: 1500                    # ~100M tokens per job; 2500 = ~170M tokens (+65% time)
  eval_mb: 50
  epochs: 1
  checkpoint_every_steps: 1000      # mid-training proxy checkpoints (resume after a crash)
  seeds: [0, 1, 2]
  lr: 0.0006
  vocab_sweep: [64000]              # the 48K-vs-64K question; ADD 32000 if the model will be <= ~125M params (+3 proxy jobs)
gpu: {guard: true, index: 0, min_free_gb: 60, max_gb: 60, max_util_pct: 30}   # index = physical GPU id for the free-check
baselines: [sarvamai/sarvam-1, google/muril-base-cased, FacebookAI/xlm-roberta-base]
