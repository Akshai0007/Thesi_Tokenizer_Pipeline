# DGX STEP 2 - TRAIN THE FINAL TOKENIZER on ALL the data with the decided design. No proxy models; CPU-bound.
# Edit `components.vocab` ONLY if step 1 (dgx_confirm) clearly justified a different size:
#   48000 = default decision (compute-neutral from ~350M params up, +5% compute per word at ~125M)
#   32000 = choose if the model is <= ~125M params and compute per word matters most
#   64000 = choose if step 1 shows 64K beating 48K by >= 2 standard errors AND the embedding table (V x d_model) stays <= ~15% of params
name: dgx_final
paths: {raw: /data/malayalam/raw, clean: /data/malayalam/clean_full, runs: /data/malayalam/runs}

sources:
  - {type: hf_stream, id: fineweb2, hf: HuggingFaceFW/fineweb-2, name: mal_Mlym, split: train, text: text, max_docs: 1000000}   # ~6.7 GB; all 3.3M docs would take ~3.5 h to download and the trainers read <= ~4 GB. KEEP IDENTICAL in both DGX configs: they share raw/
  - {type: hf_stream, id: wikipedia, hf: wikimedia/wikipedia, name: 20231101.ml, split: train, text: text}
  - {type: hf_stream, id: sangraha, hf: ai4bharat/sangraha, data_dir: verified/mal, split: train, text: text}
filters:
  - {type: length, min_chars: 80, max_chars: 300000}
  - {type: ml_ratio, min_ratio: 0.5}
  - {type: line_repetition}
# no cap: every source is used in full (natural mix). To keep the 40/30/30 mix instead, set max_train_mb to the size of the smallest
# weighted source divided by its weight and keep balance/weights.
split: {eval_permille: 3, shard_mb: 64, max_train_mb: 0, balance: true, weights: {fineweb2: 0.4, sangraha: 0.3, wikipedia: 0.3}}

components:
  normalizer: ml
  pretokenizer: word
  algorithm: {type: spm_unigram, input_sentence_size: 8000000}   # more sentences than the Kaggle run (which used ~150 MB)
  vocab: 48000
resources: {workers: 32, threads: 32, spm_max_mb: 4000}
search: {eval_docs: 100000, combine: false, factors: {}}
metrics: [basic, structure, roundtrip, stress]
selector: {type: default}
store: none
sync: {enabled: true, min_interval_s: 120, restore: true, include_cache: true, include_checkpoints: true, include_data: false}
proxy: {enabled: false}
baselines: [sarvamai/sarvam-1, google/muril-base-cased, FacebookAI/xlm-roberta-base]
