# Tiny end-to-end check (CPU, ~1 min). Synthetic data: validates mechanics, not design.
name: smoke
paths: {raw: /tmp/mltok_smoke/raw, clean: /tmp/mltok_smoke/clean, runs: /tmp/mltok_smoke/runs}
sources:
  - {type: synthetic, id: synthetic, n_docs: 4000}
filters:
  - {type: length, min_chars: 20}
  - {type: ml_ratio, min_ratio: 0.3}
split: {eval_permille: 100, shard_mb: 1}
components: {normalizer: ml, pretokenizer: word, algorithm: mlbpe, vocab: 1600}
resources: {workers: 1, threads: 1, spm_max_mb: 5}
search:
  eval_docs: 400
  combine: true
  factors:
    normalizer: [none, nfc, ml]
    pretokenizer: [ws, word]
    algorithm: [mlbpe, mlbpe_plain, hf_bpe, spm_unigram]
proxy: {enabled: true, top_k: 2, model: {type: gpt, size: nano}, seq_len: 64, batch: 8, train_mb: 0.2, eval_mb: 0.05, lr: 0.003, gpus: []}
baselines: []
