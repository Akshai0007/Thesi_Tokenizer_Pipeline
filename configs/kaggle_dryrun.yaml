# ~10-20 min (estimate) dry run on a small REAL sample: proves dataset ids, Hub baselines, both GPUs, report.
# Do not draw design conclusions from it (tiny data, tiny vocab).
name: kaggle_dryrun
paths: {raw: /kaggle/working/dryrun/raw, clean: /kaggle/working/dryrun/clean, runs: /kaggle/working/dryrun/runs}
# ---- DATA: to change a dataset, edit/replace one entry here (or drop in a new `source` plugin file) ----
sources:
  - {type: hf_stream, id: fineweb2, hf: HuggingFaceFW/fineweb-2, name: mal_Mlym, split: train, text: text, max_docs: 15000}
  - {type: hf_stream, id: wikipedia, hf: wikimedia/wikipedia, name: 20231101.ml, split: train, text: text, max_docs: 5000}
  - {type: hf_stream, id: sangraha, hf: ai4bharat/sangraha, data_dir: verified/mal, split: train, text: text, max_docs: 5000}
filters:
  - {type: length, min_chars: 80, max_chars: 100000}
  - {type: ml_ratio, min_ratio: 0.5}
  - {type: line_repetition}
split: {eval_permille: 20, shard_mb: 16, max_train_mb: 60}
components: {normalizer: ml, pretokenizer: word, algorithm: mlbpe, vocab: 4000}
resources: {workers: 4, threads: 4, max_word_types: 100000, spm_max_mb: 30}
search:
  eval_docs: 1500
  combine: true
  factors:
    normalizer: [none, ml]
    algorithm: [mlbpe, mlbpe_plain, hf_bpe, spm_unigram]
proxy: {enabled: true, top_k: 2, model: {type: gpt, size: tiny}, seq_len: 512, batch: 32, micro_batch: 16, gpus: auto,
        train_mb: 15, eval_mb: 3, epochs: 1, seeds: [0], lr: 0.001, vocab_sweep: [8000]}
baselines: [sarvamai/sarvam-1, openai-community/gpt2]
