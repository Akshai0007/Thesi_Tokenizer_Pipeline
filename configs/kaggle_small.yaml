# Kaggle selection run: find the best design on a few hundred MB, cheaply.
# Needs: GPU T4 x2 (proxy stage) and Internet ON. Dataset ids were taken from public documentation but
# could not be verified from my sandbox - the dry run (kaggle_dryrun.yaml) checks them first.
name: kaggle_v2
paths: {raw: /kaggle/working/data/raw, clean: /kaggle/working/data/clean, runs: /kaggle/working/runs}
# plugins_dir: [/kaggle/working/my_plugins]     # <- your own plugin files; a same-named file REPLACES a built-in

# ============ DATA (swap datasets here, or add a new `source` plugin) ============
sources:
  - {type: hf_stream, id: fineweb2, hf: HuggingFaceFW/fineweb-2, name: mal_Mlym, split: train, text: text, max_docs: 250000}
  - {type: hf_stream, id: wikipedia, hf: wikimedia/wikipedia, name: 20231101.ml, split: train, text: text}
  - {type: hf_stream, id: sangraha, hf: ai4bharat/sangraha, data_dir: verified/mal, split: train, text: text, max_docs: 150000}
filters:
  - {type: length, min_chars: 80, max_chars: 200000}
  - {type: ml_ratio, min_ratio: 0.5}
  - {type: line_repetition}
# Sources are INTERLEAVED by weight, so the 700 MB cap is shared instead of being filled by the first source
# (the first real run trained on 100% FineWeb-2). Weights are a starting hypothesis - test with the `datamix` variation.
split: {eval_permille: 5, shard_mb: 48, max_train_mb: 700, balance: true, weights: {fineweb2: 0.4, sangraha: 0.3, wikipedia: 0.3}}

# ============ PIPELINE COMPONENTS (each is a plugin; swap by name) ============
components: {normalizer: ml, pretokenizer: word, algorithm: mlbpe, vocab: 32000}   # base = our BPE so every factor is explored; 16K was clearly worse in the first real run
resources:
  workers: 4
  threads: 4
  max_word_types: 1500000    # the first run used 400000 of 2.98M types (possible handicap for mlbpe); a warning prints if coverage < 97%
  spm_max_mb: 150
search:
  eval_docs: 20000
  combine: true
  factors:
    normalizer: [none, ml]                    # first run: none/nfc/ml/zw-drop differed by < 0.001 fertility
    pretokenizer: [ws, word]                  # affects mlbpe / hf_bpe only
    algorithm: [mlbpe, mlbpe_plain, spm_unigram, spm_bpe, hf_bpe]
metrics: [basic, structure, roundtrip, stress]
selector: {type: default, max_mark_start: null}     # null = no pre-filter; the proxy LM arbitrates
# ---- checkpoints: every finished unit (word table, tokenizer, metrics, proxy seed, report) is pushed to the store;
# a fresh session restores it. The notebook sets `store` from HF_REPO; on the DGX set it here or via --set.
store: none            # e.g. {type: hf_hub, repo: Akzhai/mltok-malayalam-runs, private: true, prefix: kaggle}  (token: env HF_TOKEN)
sync: {enabled: true, min_interval_s: 120, ckpt_push_interval_s: 900, restore: true, include_cache: true, include_checkpoints: true, include_data: false}

proxy:
  enabled: true
  top_k: 3
  always_include: [spm_unigram, mlbpe, mlbpe_plain, hf_bpe]   # every family gets a proxy run (mlbpe vs mlbpe_plain = clean A/B of the constraint idea)
  model: {type: gpt, size: tiny}                    # ~11M non-embedding params
  seq_len: 512
  batch: 32
  micro_batch: 16             # T4 has 16 GB; accumulate to the effective batch
  gpus: auto                  # Kaggle 'GPU T4 x2' -> proxy runs fan out, one worker per GPU
  train_mb: 120
  eval_mb: 10
  epochs: 1
  checkpoint_every_steps: 200      # mid-training proxy checkpoints (resume after a crash); 0 = off
  seeds: [0, 1, 2]                # [0,1,2] -> mean +/- std per variant (noise control)
  lr: 0.001
  vocab_sweep: [48000, 64000]
gpu: {guard: false}
baselines: [sarvamai/sarvam-1, Qwen/Qwen2.5-0.5B, mistralai/Mistral-7B-v0.1, google/muril-base-cased, FacebookAI/xlm-roberta-base, openai-community/gpt2]
