# DGX run (A100 80 GB; we cap ourselves at 60 GB and wait until the GPU is free).
# Run AFTER the Kaggle run narrowed the design: set `components` and `search.factors` to the winners.
name: dgx_full
paths: {raw: /data/malayalam/raw, clean: /data/malayalam/clean, runs: /data/malayalam/runs}
# plugins_dir: [/data/malayalam/my_plugins]

sources:
  - {type: hf_stream, id: fineweb2, hf: HuggingFaceFW/fineweb-2, name: mal_Mlym, split: train, text: text}
  - {type: hf_stream, id: wikipedia, hf: wikimedia/wikipedia, name: 20231101.ml, split: train, text: text}
  - {type: hf_stream, id: sangraha, hf: ai4bharat/sangraha, data_dir: verified/mal, split: train, text: text}
filters:
  - {type: length, min_chars: 80, max_chars: 300000}
  - {type: ml_ratio, min_ratio: 0.5}
  - {type: line_repetition}
# max_train_mb: 0 = no cap -> sources are used in full (natural mix). If you set a cap, `balance`/`weights` interleave them.
split: {eval_permille: 3, shard_mb: 64, max_train_mb: 0, balance: true}

components: {normalizer: ml, pretokenizer: word, algorithm: mlbpe, vocab: 32000}
resources: {workers: 32, threads: 32, max_word_types: 4000000, spm_max_mb: 3000}
search:
  eval_docs: 100000
  combine: true
  factors:
    algorithm: [mlbpe, mlbpe_plain, hf_bpe, spm_unigram]
metrics: [basic, structure, roundtrip, stress]
selector: {type: default}
# ---- checkpoints: every finished unit (word table, tokenizer, metrics, proxy seed, report) is pushed to the store;
# a fresh session restores it. The notebook sets `store` from HF_REPO; on the DGX set it here or via --set.
store: none            # e.g. {type: hf_hub, repo: Akzhai/mltok-malayalam-runs, private: true, prefix: kaggle}  (token: env HF_TOKEN)
sync: {enabled: true, min_interval_s: 120, ckpt_push_interval_s: 900, restore: true, include_cache: true, include_checkpoints: true, include_data: false}

proxy:
  enabled: true
  top_k: 4
  model: {type: gpt, size: small}                   # ~85M non-embedding params
  seq_len: 1024
  batch: 32                   # 64K-vocab float logits are large; stay inside the 60 GB cap
  micro_batch: 16
  gpus: [0]                   # NEVER 'auto' on the DGX: it would fan out over every GPU in the box
  train_mb: 2500
  eval_mb: 50
  epochs: 1
  checkpoint_every_steps: 1000      # mid-training proxy checkpoints (resume after a crash); 0 = off
  seeds: [0]                  # [0,1,2] -> mean +/- std per variant (noise control)
  lr: 0.0006
  vocab_sweep: [16000, 24000, 32000, 48000, 64000]
gpu: {guard: true, index: 0, min_free_gb: 60, max_gb: 60, max_util_pct: 30}   # index = physical GPU id for the free-check
baselines: [sarvamai/sarvam-1, Qwen/Qwen2.5-0.5B, mistralai/Mistral-7B-v0.1, google/muril-base-cased, FacebookAI/xlm-roberta-base]
